min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
bun = "latest"
biome = "latest"
gitleaks = "latest"
pre-commit = "latest"

[tasks."default"]
description = "Show available tasks"
run = '''
mise tasks ls
'''

[tasks."install"]
description = "Install dependencies"
run = '''
bun install
'''

[tasks."dev"]
description = "Run in development mode with watch"
run = '''
bun run dev
'''

[tasks."build"]
description = "Build the project"
run = '''
bun run build
'''

[tasks."start"]
description = "Run the application"
run = '''
bun run start
'''

[tasks."test"]
description = "Run tests with Vitest"
run = '''
bun run test
'''

[tasks."test-watch"]
description = "Run tests in watch mode with Vitest"
run = '''
bun run test:watch
'''

[tasks."test-verbose"]
description = "Run tests with verbose output"
run = '''
vitest run --reporter=verbose
'''

[tasks."test-ui"]
description = "Run tests with Vitest UI"
run = '''
vitest --ui
'''

[tasks."typecheck"]
description = "Run TypeScript type checking"
run = '''
bun run typecheck
'''

[tasks."fmt"]
description = "Format code with prettier"
run = '''
bun run format
'''

[tasks."fmt-check"]
description = "Check code formatting"
run = '''
bun run format:check
'''

[tasks."lint"]
description = "Run all lints (Biome + format check + typecheck)"
run = '''
biome check . --diagnostic-level=warn
mise run fmt-check
mise run typecheck
'''

[tasks."gitleaks"]
description = "Scan staged changes for secrets before commit"
run = '''
gitleaks git --pre-commit --redact --staged --verbose
'''

[tasks."install-git-hooks"]
description = "Install the mise-managed pre-commit hook configuration"
run = '''
pre-commit install --install-hooks
'''

[tasks."clean"]
description = "Clean build artifacts"
run = '''
bun run clean
'''

[tasks."ci"]
description = "Run all CI checks"
run = '''
biome check . --diagnostic-level=warn
mise run fmt-check
mise run typecheck
mise run test
mise run build
'''
